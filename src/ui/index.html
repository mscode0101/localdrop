<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>LocalDrop</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #151515;
    --bubble: #1c1c1e;
    --border: #2a2a2a;
    --text: #e5e5e5;
    --text-dim: #777;
    --accent: #4f9eff;
    --accent-hover: #6fb3ff;
    --success: #34d399;
    --danger: #f87171;
    --radius: 12px;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  .header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .btn-back {
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 8px;
    background: var(--border);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .btn-back:hover { background: #333; }

  .header-info { flex: 1; min-width: 0; }
  .header-name {
    font-size: 16px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-status {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 1px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
  }

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    -webkit-overflow-scrolling: touch;
  }

  .chat-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 14px;
    text-align: center;
    line-height: 1.5;
  }

  .msg {
    background: var(--bubble);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    max-width: 85%;
    position: relative;
    animation: fadeIn 0.15s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-text {
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg-text.clamped {
    display: -webkit-box;
    -webkit-line-clamp: 6;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .btn-more {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    padding: 2px 0;
    margin-top: 2px;
  }
  .btn-more:hover { text-decoration: underline; }

  .msg-file {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .msg-file-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 16px;
  }
  .msg-file-info { min-width: 0; flex: 1; }
  .msg-file-name {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .msg-file-size {
    font-size: 12px;
    color: var(--text-dim);
  }

  .msg-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 6px;
    gap: 8px;
  }
  .msg-time {
    font-size: 11px;
    color: var(--text-dim);
  }
  .msg-actions {
    display: flex;
    gap: 4px;
  }

  .btn-icon {
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
    font-size: 14px;
  }
  .btn-icon:hover { background: var(--border); color: var(--text); }
  .btn-icon.copied { color: var(--success); }

  .btn-dl {
    padding: 5px 12px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: background 0.15s;
  }
  .btn-dl:hover { background: var(--accent-hover); }

  .compose {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 10px 12px;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  .compose-attach {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 8px;
    background: var(--border);
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    position: relative;
  }
  .compose-attach:hover { background: #333; }
  .compose-attach input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .compose-input {
    flex: 1;
    min-height: 40px;
    max-height: 120px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 9px 12px;
    resize: none;
    line-height: 1.4;
    overflow-y: auto;
  }
  .compose-input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .compose-send {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, opacity 0.15s;
  }
  .compose-send:hover { background: var(--accent-hover); }
  .compose-send:disabled { opacity: 0.4; cursor: default; }

  .upload-progress {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 8px 12px;
    flex-shrink: 0;
  }
  .upload-progress:empty { display: none; padding: 0; border: none; }

  .progress-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 0;
  }
  .progress-item-name {
    font-size: 12px;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .progress-item-pct {
    font-size: 12px;
    color: var(--accent);
    width: 40px;
    text-align: right;
    flex-shrink: 0;
  }
  .progress-item-pct.done { color: var(--success); }
  .progress-item-pct.error { color: var(--danger); }
  .progress-item-bar {
    width: 80px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .progress-item-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.2s;
    width: 0%;
  }
  .progress-item-fill.done { background: var(--success); }
  .progress-item-fill.error { background: var(--danger); }

  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--success);
    color: #000;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show { opacity: 1; }

  .day-sep {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    padding: 8px 0 4px;
  }
</style>
</head>
<body>

<div class="header">
  <button class="btn-back" id="backBtn" title="Leave room">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div class="header-info">
    <div class="header-name" id="roomName">__ROOM_NAME__</div>
    <div class="header-status"><span class="dot"></span><span id="onlineCount">0</span> online</div>
  </div>
</div>

<div class="chat" id="chat">
  <div class="chat-empty" id="chatEmpty">
    Send text or files to share<br>with everyone in this room
  </div>
</div>

<div class="upload-progress" id="uploadProgress"></div>

<div class="compose">
  <label class="compose-attach" title="Attach files">
    +
    <input type="file" id="fileInput" multiple>
  </label>
  <textarea class="compose-input" id="textInput" placeholder="Type a message..." rows="1"></textarea>
  <button class="compose-send" id="sendBtn" title="Send">&#9654;</button>
</div>

<div class="toast" id="toast"></div>

<script>
const ROOM_ID = window.location.pathname.split("/")[2];
const TOKEN = new URLSearchParams(window.location.search).get("t");
const API = "/api/rooms/" + ROOM_ID;
const headers = { "X-Token": TOKEN };

if (!TOKEN || !ROOM_ID) {
  window.location.href = "/";
}

const SVG_COPY = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const SVG_CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const SVG_TRASH = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
const SVG_DL = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
const SVG_FILE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>';

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
  if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + " MB";
  return (bytes / 1073741824).toFixed(2) + " GB";
}

function formatTime(ts) {
  return new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function formatDate(ts) {
  const d = new Date(ts);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return "Today";
  const yesterday = new Date(now);
  yesterday.setDate(yesterday.getDate() - 1);
  if (d.toDateString() === yesterday.toDateString()) return "Yesterday";
  return d.toLocaleDateString([], { month: "short", day: "numeric" });
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

function scrollToBottom() {
  const chat = document.getElementById("chat");
  requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
}

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;left:-9999px";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }
  btn.innerHTML = SVG_CHECK;
  btn.classList.add("copied");
  showToast("Copied to clipboard");
  setTimeout(() => { btn.innerHTML = SVG_COPY; btn.classList.remove("copied"); }, 1500);
}

function renderMessage(msg) {
  const div = document.createElement("div");
  div.className = "msg";
  div.dataset.id = msg.id;

  const isLong = msg.type === "text" && (msg.text.length > 300 || msg.text.split("\n").length > 6);

  let content = "";
  if (msg.type === "text") {
    content = '<div class="msg-text' + (isLong ? " clamped" : "") + '">' + esc(msg.text) + "</div>" + (isLong ? '<button class="btn-more">Show more</button>' : "");
  } else {
    content = '<div class="msg-file"><div class="msg-file-icon">' + SVG_FILE + '</div><div class="msg-file-info"><div class="msg-file-name">' + esc(msg.name) + '</div><div class="msg-file-size">' + formatSize(msg.size) + '</div></div><a class="btn-dl" href="' + API + "/download/" + msg.id + "?t=" + TOKEN + '" download="' + esc(msg.name) + '">' + SVG_DL + " Save</a></div>";
  }

  const copyData = msg.type === "text" ? msg.text : msg.name;

  div.innerHTML = content + '<div class="msg-footer"><span class="msg-time">' + formatTime(msg.timestamp) + '</span><div class="msg-actions"><button class="btn-icon btn-copy" title="Copy">' + SVG_COPY + '</button><button class="btn-icon btn-del" title="Delete">' + SVG_TRASH + "</button></div></div>";

  div.querySelector(".btn-copy").addEventListener("click", function() { copyText(copyData, this); });
  div.querySelector(".btn-del").addEventListener("click", () => deleteMsg(msg.id));

  const moreBtn = div.querySelector(".btn-more");
  if (moreBtn) {
    moreBtn.addEventListener("click", () => {
      const textEl = div.querySelector(".msg-text");
      const expanded = !textEl.classList.contains("clamped");
      textEl.classList.toggle("clamped", expanded);
      moreBtn.textContent = expanded ? "Show more" : "Show less";
    });
  }

  return div;
}

let lastRenderedDate = "";

function renderDateSeparator(ts) {
  const dateStr = formatDate(ts);
  if (dateStr === lastRenderedDate) return null;
  lastRenderedDate = dateStr;
  const div = document.createElement("div");
  div.className = "day-sep";
  div.textContent = dateStr;
  return div;
}

function setEmptyVisible(visible) {
  const empty = document.getElementById("chatEmpty");
  if (empty) empty.style.display = visible ? "" : "none";
}

function clearRenderedMessages() {
  document.querySelectorAll("#chat .msg, #chat .day-sep").forEach((n) => n.remove());
}

async function loadMessages() {
  try {
    const res = await fetch(API + "/messages?t=" + TOKEN);
    if (res.status === 401) { window.location.href = "/"; return; }
    const data = await res.json();
    const chat = document.getElementById("chat");

    clearRenderedMessages();
    lastRenderedDate = "";

    if (!data.messages || data.messages.length === 0) {
      setEmptyVisible(true);
      return;
    }

    setEmptyVisible(false);

    for (const msg of data.messages) {
      const sep = renderDateSeparator(msg.timestamp);
      if (sep) chat.appendChild(sep);
      chat.appendChild(renderMessage(msg));
    }
    scrollToBottom();
  } catch (e) {
    console.error("Failed to load messages", e);
  }
}

async function sendText() {
  const input = document.getElementById("textInput");
  const text = input.value.trim();
  if (!text) return;

  const btn = document.getElementById("sendBtn");
  btn.disabled = true;
  try {
    const res = await fetch(API + "/messages/text?t=" + TOKEN, {
      method: "POST",
      headers: { ...headers, "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (res.status === 401) { window.location.href = "/"; return; }
    if (res.ok) {
      input.value = "";
      input.style.height = "auto";
    }
  } catch (e) {
    console.error("Send failed", e);
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

function uploadFiles(fileList) {
  if (!fileList || fileList.length === 0) return;
  const progress = document.getElementById("uploadProgress");

  for (const file of fileList) {
    const item = document.createElement("div");
    item.className = "progress-item";
    item.innerHTML = '<span class="progress-item-name">' + esc(file.name) + '</span><div class="progress-item-bar"><div class="progress-item-fill"></div></div><span class="progress-item-pct">0%</span>';
    progress.appendChild(item);

    const fill = item.querySelector(".progress-item-fill");
    const pct = item.querySelector(".progress-item-pct");

    const form = new FormData();
    form.append("file", file);

    const xhr = new XMLHttpRequest();
    xhr.open("POST", API + "/messages/file?t=" + TOKEN);
    xhr.setRequestHeader("X-Token", TOKEN);

    xhr.upload.addEventListener("progress", (e) => {
      if (e.lengthComputable) {
        const p = Math.round((e.loaded / e.total) * 100);
        fill.style.width = p + "%";
        pct.textContent = p + "%";
      }
    });

    xhr.addEventListener("load", () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        fill.style.width = "100%";
        fill.classList.add("done");
        pct.textContent = "Done";
        pct.classList.add("done");
        showToast(file.name + " sent");
        setTimeout(() => item.remove(), 2000);
      } else if (xhr.status === 401) {
        window.location.href = "/";
      } else {
        fill.classList.add("error");
        pct.textContent = "Error";
        pct.classList.add("error");
      }
    });

    xhr.addEventListener("error", () => {
      fill.classList.add("error");
      pct.textContent = "Failed";
      pct.classList.add("error");
    });

    xhr.send(form);
  }
}

async function deleteMsg(id) {
  try {
    await fetch(API + "/messages/" + id + "?t=" + TOKEN, { method: "DELETE", headers });
    removeMessage(id);
  } catch (e) {
    console.error("Delete failed", e);
  }
}

// Back button
document.getElementById("backBtn").addEventListener("click", () => {
  window.location.href = "/";
});

// Compose handlers
const textInput = document.getElementById("textInput");
const fileInput = document.getElementById("fileInput");
const sendBtn = document.getElementById("sendBtn");

textInput.addEventListener("input", () => {
  textInput.style.height = "auto";
  textInput.style.height = Math.min(textInput.scrollHeight, 120) + "px";
});

textInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendText();
  }
});

sendBtn.addEventListener("click", sendText);

fileInput.addEventListener("change", () => {
  uploadFiles(fileInput.files);
  fileInput.value = "";
});

const chat = document.getElementById("chat");
chat.addEventListener("dragover", (e) => { e.preventDefault(); });
chat.addEventListener("drop", (e) => {
  e.preventDefault();
  uploadFiles(e.dataTransfer.files);
});

const knownIds = new Set();

function appendMessage(msg) {
  if (knownIds.has(msg.id)) return;
  knownIds.add(msg.id);

  const chat = document.getElementById("chat");
  setEmptyVisible(false);

  const sep = renderDateSeparator(msg.timestamp);
  if (sep) chat.appendChild(sep);
  chat.appendChild(renderMessage(msg));
  scrollToBottom();
}

function removeMessage(id) {
  knownIds.delete(id);
  const el = document.querySelector('.msg[data-id="' + id + '"]');
  if (el) el.remove();
  if (!document.querySelector("#chat .msg")) {
    setEmptyVisible(true);
  }
}

loadMessages().then(() => {
  document.querySelectorAll(".msg[data-id]").forEach((el) => knownIds.add(el.dataset.id));
  connectSSE();
});

function connectSSE() {
  const es = new EventSource(API + "/events?t=" + TOKEN);

  es.addEventListener("message", (e) => {
    try { appendMessage(JSON.parse(e.data)); } catch {}
  });

  es.addEventListener("delete", (e) => {
    try { removeMessage(JSON.parse(e.data).id); } catch {}
  });

  es.addEventListener("presence", (e) => {
    try {
      const { online } = JSON.parse(e.data);
      document.getElementById("onlineCount").textContent = online;
    } catch {}
  });

  es.onerror = () => {
    es.close();
    setTimeout(connectSSE, 2000);
  };
}
</script>
</body>
</html>
